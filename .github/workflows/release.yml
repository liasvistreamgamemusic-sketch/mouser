name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Mouser.app
        run: ./build.sh "${GITHUB_REF_NAME#v}"

      - name: Zip
        run: ditto -c -k --keepParent Mouser.app "Mouser-${GITHUB_REF_NAME#v}.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "Mouser-${GITHUB_REF_NAME#v}.zip"
          --title "$GITHUB_REF_NAME"
          --generate-notes
